name: Sync generated marketplace files

on:
  push:
    branches: [main]
    paths:
      - marketplace.json
      - .github/ISSUE_TEMPLATE/addon-metadata-update.yml
      - .github/ISSUE_TEMPLATE/addon-update.yml
      - scripts/update-addon-issue-template.mjs
      - scripts/sync-pages-api.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - name: Update generated files
        env:
          COMMIT_MESSAGE: "chore: sync generated marketplace files"
        run: bun scripts/update-main.mjs
