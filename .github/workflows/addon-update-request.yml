name: Addon marketplace requests
run-name: ${{ github.event.action }} #${{ github.event.issue.number }} - ${{ github.event.issue.title }}

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  discussions: write
  pages: write
  id-token: write

jobs:
  reject-banned-addon-request:
    if: >-
      github.event_name == 'issues' &&
      (
        contains(github.event.issue.labels.*.name, 'addon-create') ||
        contains(github.event.issue.labels.*.name, 'addon-creation') ||
        contains(github.event.issue.labels.*.name, 'addon-update') ||
        contains(github.event.issue.labels.*.name, 'addon-metadata-update') ||
        contains(github.event.issue.body, '### Addon name') ||
        contains(github.event.issue.body, '### Addon ID')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Close banned addon requesters
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const policy = JSON.parse(fs.readFileSync('.github/addon-request-policy.json', 'utf8'));
            const user = context.payload.issue.user.login;
            if (!(policy.bannedUsers || []).includes(user)) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `@${user} can no longer open addon creation or update requests in this repository.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
              state_reason: 'not_planned',
            });

  validate-request:
    if: >-
      github.event_name == 'issues' &&
      (
        contains(github.event.issue.labels.*.name, 'addon-update') ||
        contains(github.event.issue.labels.*.name, 'addon-metadata-update') ||
        contains(github.event.issue.body, '### Addon ID')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate request and comment
        uses: actions/github-script@v7
        with:
          script: |
            const { validate } = require('./scripts/addon-request.cjs');
            const fs = require('fs');
            const issue = context.payload.issue;
            const policy = JSON.parse(fs.readFileSync('.github/addon-request-policy.json', 'utf8'));
            const user = issue.user.login;
            const result = validate(issue.body || '', {
              user,
              userId: issue.user.id,
              banned: (policy.bannedUsers || []).includes(user),
              trusted: (policy.trustedUsers || []).includes(user),
            });

            const desiredTitle = result.addon?.name ? `Update addon: ${result.addon.name}` : (result.payload.addonId ? `Update addon: ${result.payload.addonId}` : 'Update addon');
            if (issue.title !== desiredTitle) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title: desiredTitle,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: result.summary,
            });

            if (context.payload.action === 'opened' && result.addon?.discussion?.id) {
              const discussionBody = [
                `Update requested by @${user} in #${issue.number}.`,
                '',
                `**Requested target:** ${result.payload.targetRef || 'newest tag on approval'}`,
                result.errors.length ? `**Needs changes before review:**\n${result.errors.map((error) => `- ${error}`).join('\n')}` : '**Ready for review**',
              ].filter(Boolean).join('\n');

              await github.graphql(`
                mutation($discussionId: ID!, $body: String!) {
                  addDiscussionComment(input: { discussionId: $discussionId, body: $body }) {
                    comment { id }
                  }
                }
              `, { discussionId: result.addon.discussion.id, body: discussionBody });
            }

            if ((policy.bannedUsers || []).includes(user)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned',
              });
            }

  validate-create-request:
    if: >-
      github.event_name == 'issues' &&
      (
        contains(github.event.issue.labels.*.name, 'addon-create') ||
        contains(github.event.issue.body, '### Addon name')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate submission and comment
        uses: actions/github-script@v7
        with:
          script: |
            const { validateCreate } = require('./scripts/addon-request.cjs');
            const fs = require('fs');
            const issue = context.payload.issue;
            const policy = JSON.parse(fs.readFileSync('.github/addon-request-policy.json', 'utf8'));
            const user = issue.user.login;
            const result = validateCreate(issue.body || '', {
              user,
              banned: (policy.bannedUsers || []).includes(user),
            });

            const desiredTitle = result.payload.name ? `Add addon: ${result.payload.name}` : 'Add addon';
            if (issue.title !== desiredTitle) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title: desiredTitle,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: result.summary,
            });

            if ((policy.bannedUsers || []).includes(user)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned',
              });
            }

  auto-approve-trusted-request:
    if: >-
      github.event_name == 'issues' &&
      (
        contains(github.event.issue.labels.*.name, 'addon-update') ||
        contains(github.event.issue.labels.*.name, 'addon-metadata-update') ||
        contains(github.event.issue.body, '### Addon ID')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - name: Check trust and validation
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { isVersionUpdateRequest, validate } = require('./scripts/addon-request.cjs');
            const policy = JSON.parse(fs.readFileSync('.github/addon-request-policy.json', 'utf8'));
            const user = context.payload.issue.user.login;
            const labels = context.payload.issue.labels.map((label) => label.name);
            const trusted = (policy.trustedUsers || []).includes(user);
            const banned = (policy.bannedUsers || []).includes(user);
            const result = validate(context.payload.issue.body || '', { user, userId: context.payload.issue.user.id, trusted, banned });
            const versionUpdate = isVersionUpdateRequest(context.payload.issue.body || '', labels);
            core.setOutput('apply', String(versionUpdate && trusted && !banned && result.errors.length === 0));
            core.setOutput('discussion_id', result.addon?.discussion?.id || '');

      - name: Apply trusted marketplace update
        if: steps.check.outputs.apply == 'true'
        env:
          COMMIT_MESSAGE: "chore(addons): auto-approve trusted update from issue #${{ github.event.issue.number }}"
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ADDON_REQUESTER_ID: ${{ github.event.issue.user.id }}
          ADDON_UPDATED_AT: ${{ github.event.issue.updated_at }}
        run: bun scripts/update-main.mjs -- bun scripts/addon-request.cjs apply-by-label

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.apply == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.apply == 'true'
        with:
          path: _site

      - name: Deploy GitHub Pages
        if: steps.check.outputs.apply == 'true'
        uses: actions/deploy-pages@v4

      - name: Post trusted update approval to discussion
        if: steps.check.outputs.apply == 'true' && steps.check.outputs.discussion_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Addon update approved for trusted requester.',
              '',
              `Issue: #${context.payload.issue.number}`,
            ].join('\n');

            await github.graphql(`
              mutation($discussionId: ID!, $body: String!) {
                addDiscussionComment(input: { discussionId: $discussionId, body: $body }) {
                  comment { id }
                }
              }
            `, { discussionId: '${{ steps.check.outputs.discussion_id }}', body });

      - name: Comment and close trusted request
        if: steps.check.outputs.apply == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: 'Trusted requester update was approved and applied.',
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
            });
